name: publicar

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão SemVer a publicar (ex.: 0.1.0-alfa.1)'
        required: true

permissions:
  contents: read

jobs:
  publicar:
    name: Empacotar e publicar
    runs-on: ubuntu-latest
    environment: nuget
    env:
      VERSAO: ${{ inputs.versao }}
    steps:
      - name: Validar versão
        run: |
          [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Versão inválida: $VERSAO"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Testar
        run: |
          dotnet build -c Release -p:Version="$VERSAO"
          dotnet test --no-build -c Release
      - name: Empacotar
        run: dotnet pack --no-build -c Release -o pacotes -p:Version="$VERSAO"
      - name: Publicar
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "pacotes/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
